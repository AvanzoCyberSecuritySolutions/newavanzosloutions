<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avanzo Solutions</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body class="font-poppins">
  <div class="absolute top-8 left-4 sm:left-6 lg:left-8">
            <a href="index.html" class="flex items-center text-black/80 hover:text-brandGreen transition-colors duration-300 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 mr-2 transform group-hover:-translate-x-1 transition-transform duration-300">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                <span class="text-sm font-medium">Back to Home</span>
            </a>
        </div>
    <div class="bg-gray-100 py-6 sm:py-10 min-h-screen flex justify-center items-center px-2 sm:px-4">
        <div class="bg-white shadow-lg rounded-lg p-4 sm:p-8 w-full max-w-4xl">
            <!-- Header -->
            <div class="text-center mb-8">
                <img class="w-28 mx-auto" src="images/image.jpeg" alt="Logo">
                <h1 class="text-lg font-semibold mt-4">avanzo</h1>
                <p class="text-sm text-gray-600">CYBER SECURITY SOLUTIONS PVT.LTD</p>
                <p class="text-sm text-gray-600">
                    Nra 89, White Field, Puthurkkara, Ayyanthole<br>Thrissur - 680003, Kerala
                </p>
            </div>

            <!-- Title -->
            <h2 class="text-xl font-bold mb-6 text-center">CONSULTATION AND ISSUE REGISTRATION FORM</h2>

    <!-- Form -->
    <div class="space-y-6 p-4 sm:p-6 bg-gray-100 rounded-lg shadow-lg max-w-4xl mx-auto">
    
    <!-- Name -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="name" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">Name:</label>
      <input id="name" type="text" class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent">
    </div>
  
    <!-- DOB -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="dob" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">DOB:</label>
      <input id="dob" type="date" class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent">
    </div>
  
    <!-- Address -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="address" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">Address:</label>
      <input id="address" type="text" class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent">
    </div>
  
    <!-- KYC Submitted -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="kyc" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">KYC Submitted:</label>
      <input 
        id="kyc" 
        type="text" 
        placeholder="Contact person / Individual asking for the appointment" 
        class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent text-sm">
    </div>

    <!-- Document Attachment -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="documents" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">Attach Document:</label>
      <input 
        id="documents" 
        type="file" 
        class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 text-sm text-gray-700">
    </div>

    <!-- Organisation -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="organisation" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">Organisation:</label>
      <input id="organisation" type="text" class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent">
    </div>
  
    <!-- Type of Organisation -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="orgType" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">Type of Organisation:</label>
      <input id="orgType" type="text" class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent">
    </div>
  
    <!-- Proof of Registration -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="proof" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">Proof of Registration:</label>
      <input id="proof" type="text" class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent">
    </div>
  
    <!-- Issue in Brief -->
    <div>
      <label for="issue" class="block text-gray-700 font-medium mb-1">Issue in Brief:</label>
      <textarea id="issue" rows="4" 
        class="w-full border border-gray-400 rounded-lg focus:outline-none focus:border-blue-500 p-2"></textarea>
    </div>
  
    <!-- Consultation With -->
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
      <label for="consultWith" class="w-full sm:w-1/3 text-gray-700 font-medium shrink-0">Consultation With:</label>
      <select id="consultWith" class="w-full sm:w-2/3 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent">
        <option>Pattathil Dhanya Menon</option>
        <option>Legal Team</option>
        <option>Technical Team</option>
        <option>Psychology Team</option>
      </select>
    </div>
  
    <!-- Terms -->
    <p class="text-sm text-gray-600 text-center">Read the terms and conditions of the appointment</p>
  
    <div class="space-y-4 pt-2">
      <!-- Date and Time -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Date -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-2">
          <label for="date" class="w-full sm:w-auto text-gray-700 font-medium min-w-[60px]">Date:</label>
          <input 
            id="date" 
            type="date" 
            class="w-full border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent text-gray-700"
          />
        </div>
        
        <!-- Time -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-2">
          <label for="time" class="w-full sm:w-auto text-gray-700 font-medium min-w-[60px]">Time:</label>
          <input 
            id="time" 
            type="time" 
            class="w-full border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent text-gray-700"
          />
        </div>
      </div>
    
      <!-- Place -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2">
        <label for="place" class="w-full sm:w-auto text-gray-700 font-medium min-w-[60px]">Place:</label>
        <select 
          id="place" 
          class="w-full sm:w-48 border-b border-gray-400 focus:outline-none focus:border-blue-500 py-1 bg-transparent text-gray-700"
        >
          <option>Thrissur</option>
          <option>Mangalore</option>
        </select>
      </div>
    </div>
    
  
    <!-- Submit Button -->
  <div class="text-center">
    <button class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring focus:ring-blue-300">
      Submit
    </button>
  </div>
</div> 

</body>
</html>
